name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # 可选：在仓库 Secrets 中配置 SIGNING_KEYSTORE_BASE64 / SIGNING_STORE_PASSWORD /
      # SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD 后，release 包使用正式签名
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Read version
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Rename APKs
        run: |
          VERSION="v${VERSION_NAME}"
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/DictationHelper-${VERSION}-release.apk"
          cp app/build/outputs/apk/debug/*.apk "dist/DictationHelper-${VERSION}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DictationHelper-apk
          path: dist/*.apk

      # 推送代码时自动发布 / 更新 v<versionName> 的 Release（标签由 Action 创建）；
      # 发布新版本只需修改 app/build.gradle.kts 中的 versionName
      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: 听写助手 v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.apk
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
